<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="blender-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea7600"/>
      <stop offset="100%" stop-color="#236192"/>
    </linearGradient>
    <linearGradient id="wireframe-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="blender-glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="#181818"/>

  <!-- 3D Grid Ground Plane -->
  <g stroke="#333333" stroke-width="1" opacity="0.6">
    <line x1="0" y1="360" x2="800" y2="360" stroke="#ff3838" stroke-width="2"/> <!-- X Axis -->
    <line x1="400" y1="0" x2="400" y2="450" stroke="#2ed573" stroke-width="2"/> <!-- Y Axis -->
    <!-- Perspective Floor Grid -->
    <path d="M0,420 L800,420 M0,390 L800,390 M0,330 L800,330 M0,300 L800,300" />
    <path d="M100,250 L0,450 M250,250 L180,450 M400,250 L400,450 M550,250 L620,450 M700,250 L800,450" />
  </g>

  <!-- Left Side: Wireframe Topology / Mesh View -->
  <!-- Diagonal Split Dividing Line -->
  <line x1="380" y1="0" x2="420" y2="450" stroke="#00f2fe" stroke-width="3" stroke-dasharray="8,4" filter="url(#blender-glow)"/>

  <!-- 3D Sci-Fi Weapon / Railgun Asset (Wireframe on left, Shaded PBR on right) -->
  <g transform="translate(180, 140)">
    <!-- Wireframe Half (Left) -->
    <g stroke="#00f2fe" stroke-width="1.5" fill="none">
      <polygon points="40,90 120,70 210,70 210,120 120,120 40,110" />
      <line x1="40" y1="90" x2="210" y2="90" />
      <line x1="40" y1="100" x2="210" y2="100" />
      <line x1="80" y1="80" x2="80" y2="115" />
      <line x1="120" y1="70" x2="120" y2="120" />
      <line x1="160" y1="70" x2="160" y2="120" />
      <!-- Wireframe Barrel -->
      <polygon points="-40,95 40,90 40,110 -40,105" />
      <line x1="-20" y1="94" x2="-20" y2="106" />
      <line x1="0" y1="92" x2="0" y2="108" />
      <line x1="20" y1="91" x2="20" y2="109" />
      <!-- Wireframe Stock -->
      <polygon points="120,120 150,170 170,165 140,120" />
      <line x1="130" y1="135" x2="155" y2="135" />
      <line x1="140" y1="150" x2="165" y2="150" />
    </g>

    <!-- Shaded PBR Half (Right) -->
    <g transform="translate(210, 0)">
      <!-- Main Receiver Shaded -->
      <path d="M0,70 L140,75 L180,105 L150,130 L60,135 L0,120 Z" fill="#2d3436" stroke="#485460" stroke-width="2"/>
      <!-- Metallic Highlights & Specular Reflections -->
      <path d="M10,78 L130,82 L150,100 L30,95 Z" fill="#636e72" opacity="0.6"/>
      <line x1="5" y1="74" x2="135" y2="79" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
      <!-- Glowing Power Core / Plasma Chamber -->
      <rect x="25" y="88" width="80" height="18" rx="4" fill="#000000" stroke="#ea7600" stroke-width="1.5"/>
      <rect x="30" y="92" width="70" height="10" rx="3" fill="#ff7600" filter="url(#blender-glow)"/>
      <line x1="35" y1="97" x2="95" y2="97" stroke="#ffffff" stroke-width="2"/>
      <!-- Scope Attachment -->
      <rect x="30" y="48" width="90" height="24" rx="4" fill="#1e272e" stroke="#57606f" stroke-width="1.5"/>
      <ellipse cx="120" cy="60" rx="5" ry="10" fill="#00f2fe" filter="url(#blender-glow)"/>
      <!-- Grip -->
      <path d="M30,130 L60,180 L80,175 L50,130 Z" fill="#1e272e" stroke="#2d3436" stroke-width="2"/>
      <!-- Carbon Texture Stripes -->
      <line x1="40" y1="145" x2="65" y2="145" stroke="#333333" stroke-width="3"/>
      <line x1="45" y1="160" x2="70" y2="160" stroke="#333333" stroke-width="3"/>
    </g>
  </g>

  <!-- Blender UI Overlays & Labels -->
  <!-- Top Left: Viewport Header -->
  <g transform="translate(30, 25)">
    <rect width="210" height="32" rx="4" fill="#252525" stroke="#3d3d3d" stroke-width="1"/>
    <circle cx="16" cy="16" r="6" fill="#ea7600"/>
    <text x="32" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">WIREFRAME</text>
    <text x="120" y="20" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">|  SOLID VIEW</text>
  </g>

  <!-- Top Right: Material & Polycount -->
  <g transform="translate(560, 25)">
    <rect width="210" height="32" rx="4" fill="#252525" stroke="#3d3d3d" stroke-width="1"/>
    <circle cx="16" cy="16" r="6" fill="#00f2fe"/>
    <text x="32" y="20" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00f2fe">TRIS: 14,820</text>
    <text x="130" y="20" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">| PBR 4K</text>
  </g>

  <!-- Bottom Blender Badge -->
  <g transform="translate(40, 395)">
    <rect width="180" height="30" rx="15" fill="rgba(234, 118, 0, 0.2)" stroke="#ea7600" stroke-width="1.5"/>
    <text x="20" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ea7600">BLENDER 3D MODEL</text>
  </g>

  <rect width="800" height="450" fill="none" stroke="rgba(234, 118, 0, 0.4)" stroke-width="2"/>
</svg>
