<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="av-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="100" cy="100" r="95" fill="#13151f" stroke="#00f2fe" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="#1e2235"/>

  <!-- Developer Headset Band -->
  <path d="M50,85 C50,45 150,45 150,85" stroke="#74b9ff" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Headset Ear Cushions -->
  <rect x="42" y="75" width="16" height="30" rx="8" fill="#0984e3"/>
  <rect x="142" y="75" width="16" height="30" rx="8" fill="#0984e3"/>
  <!-- Mic Boom -->
  <path d="M50,95 Q50,130 80,130" stroke="#74b9ff" stroke-width="4" fill="none"/>
  <circle cx="82" cy="130" r="5" fill="#00f2fe" filter="url(#av-glow)"/>

  <!-- Hair / Head -->
  <path d="M68,75 Q100,50 132,75 Q135,115 100,125 Q65,115 68,75 Z" fill="#2d3436"/>
  <!-- Face -->
  <ellipse cx="100" cy="92" rx="26" ry="24" fill="#fed3a7"/>

  <!-- Stylized Hair Curls/Spikes -->
  <path d="M72,75 C70,55 90,52 100,56 C115,50 135,55 128,75 C118,65 82,65 72,75 Z" fill="#1e272e"/>

  <!-- Cyber Visor / Glasses -->
  <rect x="76" y="86" width="48" height="15" rx="4" fill="#00f2fe" opacity="0.85" filter="url(#av-glow)"/>
  <line x1="80" y1="93" x2="120" y2="93" stroke="#ffffff" stroke-width="2"/>

  <!-- Smirk / Smile -->
  <path d="M93,106 Q100,111 107,106" stroke="#d63031" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Hoodie / Shoulders -->
  <path d="M40,188 C40,145 70,135 100,135 C130,135 160,145 160,188 Z" fill="#2c3e50"/>
  <!-- Inner shirt collar -->
  <polygon points="85,135 100,155 115,135" fill="#00f2fe"/>
</svg>
